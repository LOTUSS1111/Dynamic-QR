<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <title>Dynamic QR by Orca-8n</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <style>
    :root {
      --bg: #000000;
      --surface: #0d0d0d;
      --surface-2: #161616;
      --border: #242424;
      --text: #ffffff;
      --muted: #888888;
      --active: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 460px; min-height: 100vh; display: flex; flex-direction: column; padding: 18px 16px 88px; }
    .hidden { display: none !important; }

    /* Auth */
    .auth-box { margin: auto 0; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 20px; }
    .auth-logo { width: 64px; height: 64px; display: block; margin: 0 auto 12px; border-radius: 14px; border: 1px solid var(--border); }
    .brand-title { font-size: 21px; font-weight: 800; margin: 0 0 4px; text-align: center; letter-spacing: 0.3px; }
    .brand-sub { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 24px; letter-spacing: 0.5px; }
    .tabs-auth { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
    .tabs-auth button { flex: 1; background: transparent; border: none; color: var(--muted); padding: 9px; border-radius: 7px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .tabs-auth button.active { background: var(--surface-2); color: var(--text); }

    /* Inputs & Buttons */
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="password"], input[type="url"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 14px; outline: none;
    }
    input:focus { border-color: #fff; }
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 13px; color: var(--muted); cursor: pointer; }
    .checkbox-row input { width: 16px; height: 16px; accent-color: #fff; margin: 0; }

    .btn-primary { width: 100%; background: #fff; color: #000; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
    .btn-primary:disabled { opacity: 0.5; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 9px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid #3a1a1a; padding: 9px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }

    /* Header & Cards */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .top-brand { font-size: 15px; font-weight: 800; }
    .top-brand span { font-size: 11px; color: var(--muted); font-weight: 500; display: block; }
    .scans-pill { font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); padding: 5px 11px; border-radius: 20px; color: var(--muted); }
    .scans-pill span { color: var(--text); font-weight: 700; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 14px; font-weight: 700; margin: 0; color: #e5e5e5; }

    /* Toggle Switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #333; border-radius: 24px; transition: 0.25s; }
    .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.25s; }
    input:checked + .slider { background: var(--active); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* QR */
    .qr-wrapper { display: flex; flex-direction: column; align-items: center; }
    #qrcode { background: #fff; padding: 12px; border-radius: 12px; margin-bottom: 14px; transition: opacity 0.25s; }
    #qrcode.paused { opacity: 0.25; }
    .qr-actions { display: flex; gap: 10px; width: 100%; }
    .qr-actions button { flex: 1; }

    /* Active Box */
    .active-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .status-row { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .status-row.on { color: var(--active); }
    .status-row.paused { color: var(--warn); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .active-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .active-url { font-size: 12px; color: var(--muted); word-break: break-all; direction: ltr; text-align: right; }

    /* History */
    .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
    .history-item.is-active { border-color: var(--active); }
    .h-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .h-title { font-weight: 700; font-size: 15px; }
    .h-date { font-size: 11px; color: var(--muted); }
    .h-url { font-size: 12px; color: var(--muted); word-break: break-all; direction: ltr; text-align: right; margin-bottom: 10px; }
    .h-actions { display: flex; gap: 8px; }
    .h-actions button { flex: 1; padding: 7px; font-size: 12px; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 460px; background: rgba(8,8,8,0.96);
      border-top: 1px solid var(--border); display: flex; padding: 10px 8px; z-index: 50;
    }
    .nav-btn { flex: 1; background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600; padding: 8px; cursor: pointer; border-radius: 8px; }
    .nav-btn.active { color: var(--text); background: var(--surface-2); }

    #toast {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      background: #fff; color: #000; padding: 9px 18px; border-radius: 30px;
      font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<div id="toast"></div>

<div class="app-container">

  <!-- شاشة الدخول -->
  <div id="authScreen" class="auth-box">
    <img src="icon.svg" alt="Orca-8n" class="auth-logo">
    <h1 class="brand-title">Dynamic QR</h1>
    <p class="brand-sub">BY ORCA-8N</p>

    <div class="tabs-auth">
      <button id="tabLogin" class="active" onclick="switchAuthMode('login')">تسجيل الدخول</button>
      <button id="tabRegister" onclick="switchAuthMode('register')">حساب جديد</button>
    </div>

    <label>الاسم</label>
    <input type="text" id="authUser" placeholder="اسم المستخدم">

    <label>الرقم السري</label>
    <input type="password" id="authPass" placeholder="••••••">

    <label class="checkbox-row">
      <input type="checkbox" id="rememberMe" checked>
      <span>حفظ تسجيل الدخول على هذا الجهاز</span>
    </label>

    <button class="btn-primary" id="authSubmitBtn" onclick="handleAuth()">دخول</button>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="mainApp" class="hidden">
    <div class="top-bar">
      <div class="top-brand">Dynamic QR <span>by Orca-8n • <b id="displayUsername">---</b></span></div>
      <div class="scans-pill">المسح: <span id="displayScans">0</span></div>
    </div>

    <!-- الرئيسية -->
    <div id="viewHome">
      <div class="card">
        <div class="card-header">
          <div class="card-title">رمز الـ QR الثابت</div>
          <label style="display:flex; align-items:center; gap:8px; margin:0; font-size:12px;">
            <span id="pauseLabel">نشط</span>
            <span class="switch">
              <input type="checkbox" id="qrActiveSwitch" checked onchange="togglePause()">
              <span class="slider"></span>
            </span>
          </label>
        </div>
        <div class="qr-wrapper">
          <div id="qrcode"></div>
          <div class="qr-actions">
            <button class="btn-outline" onclick="downloadQR()">تحميل الصورة</button>
            <button class="btn-outline" onclick="copyStaticLink()">نسخ الرابط الثابت</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:10px;">حالة التوجيه الحالية</div>
        <div class="active-box">
          <div class="status-row on" id="statusRow"><span class="dot"></span> <span id="activeStatusText">مُفعّل الآن</span></div>
          <div class="active-title" id="activeTitleDisplay">لا يوجد رابط مفعل</div>
          <div class="active-url" id="activeUrlDisplay">أضف رابطاً بالأسفل لتوجيه الـ QR</div>
        </div>
      </div>

      <div class="card">
        <div class="card-title" style="margin-bottom:12px;">إضافة وتفعيل رابط جديد</div>
        <label>اسم الرابط</label>
        <input type="text" id="newTitle" placeholder="مثال: واتساب، البورتفوليو، اللوكيشن">
        <label>الرابط (URL)</label>
        <input type="url" id="newUrl" placeholder="https://...">
        <button class="btn-primary" id="addLinkBtn" onclick="addLink()">حفظ وتفعيل فوراً</button>
      </div>
    </div>

    <!-- السجل -->
    <div id="viewHistory" class="hidden">
      <div class="card-title" style="margin-bottom:14px;">سجل الروابط المحفوظة</div>
      <div id="historyList"></div>
    </div>

    <!-- الحساب -->
    <div id="viewAccount" class="hidden">
      <div class="card">
        <div class="card-title" style="margin-bottom:12px;">بيانات الحساب</div>
        <p style="font-size:13px; color:var(--muted); margin:6px 0;">المعرّف: <strong style="color:#fff;" id="accId">---</strong></p>
        <p style="font-size:13px; color:var(--muted); margin:6px 0;">الاسم: <strong style="color:#fff;" id="accName">---</strong></p>
        <p style="font-size:13px; color:var(--muted); margin:6px 0 18px;">إجمالي المسح: <strong style="color:#fff;" id="accScans">0</strong></p>
        <button class="btn-danger" style="width:100%;" onclick="logout()">تسجيل الخروج</button>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-btn active" id="navHome" onclick="switchTab('home')">الرئيسية</button>
      <button class="nav-btn" id="navHistory" onclick="switchTab('history')">السجل</button>
      <button class="nav-btn" id="navAccount" onclick="switchTab('account')">الحساب</button>
    </nav>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyy9jb_sMCxkAqaVHrCdvudXzoLjR3oD5TrzK7ftHNZz-boFvvtVgTcWmbuAbhuDofN6g/exec";
  let authMode = "login";
  let currentUser = null;
  let userHistory = [];
  let qrGenerated = false;

  window.addEventListener("DOMContentLoaded", () => {
    const savedUser = localStorage.getItem("o8n_qr_user");
    const savedHist = localStorage.getItem("o8n_qr_hist");
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      userHistory = savedHist ? JSON.parse(savedHist) : [];
      openApp();
      syncData();
    }
  });

  function saveLocal() {
    if (localStorage.getItem("o8n_qr_user")) {
      localStorage.setItem("o8n_qr_user", JSON.stringify(currentUser));
      localStorage.setItem("o8n_qr_hist", JSON.stringify(userHistory));
    }
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  function switchAuthMode(mode) {
    authMode = mode;
    document.getElementById("tabLogin").classList.toggle("active", mode === "login");
    document.getElementById("tabRegister").classList.toggle("active", mode === "register");
    document.getElementById("authSubmitBtn").innerText = mode === "login" ? "دخول" : "إنشاء الحساب";
  }

  async function apiCall(payload) {
    const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });
    return await res.json();
  }

  async function handleAuth() {
    const username = document.getElementById("authUser").value.trim();
    const password = document.getElementById("authPass").value.trim();
    const remember = document.getElementById("rememberMe").checked;
    if (!username || !password) return showToast("أدخل الاسم والرقم السري");

    const btn = document.getElementById("authSubmitBtn");
    btn.disabled = true; btn.innerText = "جاري الدخول...";

    try {
      const res = await apiCall({ action: authMode, username, password });
      if (res.status === "success") {
        currentUser = res.user;
        userHistory = res.history || [];
        if (remember) {
          localStorage.setItem("o8n_qr_user", JSON.stringify(currentUser));
          localStorage.setItem("o8n_qr_hist", JSON.stringify(userHistory));
        }
        openApp();
      } else {
        showToast(res.message || "بيانات غير صحيحة");
      }
    } catch { showToast("تعذر الاتصال بالسيرفر"); }
    finally { btn.disabled = false; btn.innerText = authMode === "login" ? "دخول" : "إنشاء الحساب"; }
  }

  async function syncData() {
    if (!currentUser) return;
    try {
      const res = await apiCall({ action: "sync", userId: currentUser.id });
      if (res.status === "success") {
        currentUser = res.user;
        userHistory = res.history || [];
        saveLocal();
        renderUI();
      }
    } catch {}
  }

  function getStaticRedirectUrl() {
    const base = location.href.substring(0, location.href.lastIndexOf("/") + 1);
    return `${base}go.html?id=${currentUser.id}`;
  }

  function openApp() {
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    renderUI();
    generateQRWhenReady();
  }

  function generateQRWhenReady() {
    if (qrGenerated) return;
    if (typeof QRCode === "undefined") return setTimeout(generateQRWhenReady, 100);
    document.getElementById("qrcode").innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
      text: getStaticRedirectUrl(), width: 185, height: 185,
      colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
    });
    qrGenerated = true;
  }

  function renderUI() {
    document.getElementById("displayUsername").innerText = currentUser.username;
    document.getElementById("displayScans").innerText = currentUser.scans || 0;
    document.getElementById("accId").innerText = currentUser.id;
    document.getElementById("accName").innerText = currentUser.username;
    document.getElementById("accScans").innerText = currentUser.scans || 0;

    const isPaused = Boolean(currentUser.isPaused);
    document.getElementById("qrActiveSwitch").checked = !isPaused;
    document.getElementById("pauseLabel").innerText = isPaused ? "متوقف مؤقتاً" : "نشط";
    document.getElementById("qrcode").classList.toggle("paused", isPaused);

    const statusRow = document.getElementById("statusRow");
    if (isPaused) {
      statusRow.className = "status-row paused";
      document.getElementById("activeStatusText").innerText = "التوجيه متوقف مؤقتاً";
    } else if (currentUser.activeUrl) {
      statusRow.className = "status-row on";
      document.getElementById("activeStatusText").innerText = "مُفعّل الآن";
    } else {
      statusRow.className = "status-row paused";
      document.getElementById("activeStatusText").innerText = "بانتظار إضافة رابط";
    }

    document.getElementById("activeTitleDisplay").innerText = currentUser.activeTitle || "لا يوجد رابط مفعل";
    document.getElementById("activeUrlDisplay").innerText = currentUser.activeUrl || "أضف رابطاً بالأسفل لتوجيه الـ QR";
    renderHistory();
  }

  function renderHistory() {
    const container = document.getElementById("historyList");
    if (!userHistory.length) {
      container.innerHTML = `<div class="card" style="text-align:center; color:var(--muted); font-size:13px;">السجل فارغ حالياً</div>`;
      return;
    }
    container.innerHTML = userHistory.map(item => {
      const isActive = item.url === currentUser.activeUrl;
      return `
        <div class="history-item ${isActive ? 'is-active' : ''}">
          <div class="h-head">
            <span class="h-title">${item.title}</span>
            <span class="h-date">${item.date || ''}</span>
          </div>
          <div class="h-url">${item.url}</div>
          <div class="h-actions">
            ${isActive
              ? `<button class="btn-outline" style="color:var(--active); border-color:var(--active);" disabled>مُفعّل حالياً</button>`
              : `<button class="btn-primary" onclick="activateFromHistory('${encodeURIComponent(item.url)}', '${encodeURIComponent(item.title)}')">تفعيل الآن</button>`
            }
            <button class="btn-danger" onclick="deleteFromHistory('${item.logId}')">حذف</button>
          </div>
        </div>
      `;
    }).join("");
  }

  async function togglePause() {
    const isPaused = !document.getElementById("qrActiveSwitch").checked;
    currentUser.isPaused = isPaused;
    saveLocal();
    renderUI();
    showToast(isPaused ? "تم إيقاف الـ QR مؤقتاً" : "تم إعادة تشغيل الـ QR");
    try { await apiCall({ action: "togglePause", userId: currentUser.id, isPaused }); } catch {}
  }

  async function addLink() {
    const title = document.getElementById("newTitle").value.trim() || "رابط جديد";
    let url = document.getElementById("newUrl").value.trim();
    if (!url) return showToast("أدخل الرابط أولاً");
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;

    currentUser.activeTitle = title;
    currentUser.activeUrl = url;
    userHistory.unshift({ logId: "temp_" + Date.now(), title, url, date: new Date().toLocaleDateString("ar-EG") });
    document.getElementById("newTitle").value = "";
    document.getElementById("newUrl").value = "";
    saveLocal();
    renderUI();
    showToast("تم التفعيل والحفظ");

    try {
      const res = await apiCall({ action: "addLink", userId: currentUser.id, title, url });
      if (res.status === "success") { userHistory = res.history; saveLocal(); renderHistory(); }
    } catch {}
  }

  async function activateFromHistory(encUrl, encTitle) {
    const url = decodeURIComponent(encUrl);
    const title = decodeURIComponent(encTitle);
    currentUser.activeUrl = url;
    currentUser.activeTitle = title;
    saveLocal();
    renderUI();
    showToast("تم التبديل فوراً");
    try { await apiCall({ action: "setActive", userId: currentUser.id, url, title }); } catch {}
  }

  async function deleteFromHistory(logId) {
    userHistory = userHistory.filter(i => i.logId !== logId);
    saveLocal();
    renderHistory();
    showToast("تم الحذف");
    try { await apiCall({ action: "deleteLink", userId: currentUser.id, logId }); } catch {}
  }

  function copyStaticLink() { navigator.clipboard.writeText(getStaticRedirectUrl()); showToast("تم نسخ الرابط الثابت"); }

  function downloadQR() {
    const canvas = document.querySelector("#qrcode canvas");
    if (!canvas) return;
    const link = document.createElement("a");
    link.download = `DynamicQR-${currentUser.username}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  }

  function switchTab(tab) {
    document.getElementById("viewHome").classList.toggle("hidden", tab !== "home");
    document.getElementById("viewHistory").classList.toggle("hidden", tab !== "history");
    document.getElementById("viewAccount").classList.toggle("hidden", tab !== "account");
    document.getElementById("navHome").classList.toggle("active", tab === "home");
    document.getElementById("navHistory").classList.toggle("active", tab === "history");
    document.getElementById("navAccount").classList.toggle("active", tab === "account");
  }

  function logout() {
    localStorage.removeItem("o8n_qr_user");
    localStorage.removeItem("o8n_qr_hist");
    currentUser = null; userHistory = []; qrGenerated = false;
    document.getElementById("mainApp").classList.add("hidden");
    document.getElementById("authScreen").classList.remove("hidden");
    document.getElementById("authPass").value = "";
  }
</script>
</body>
</html>
