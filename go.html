<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Dynamic QR by Orca-8n</title>
  <style>
    body {
      margin: 0; height: 100vh; background: #000; color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    .spinner {
      width: 32px; height: 32px; border: 2px solid #1f1f1f;
      border-top-color: #fff; border-radius: 50%;
      animation: s 0.6s linear infinite; margin-bottom: 16px;
    }
    @keyframes s { to { transform: rotate(360deg); } }
    #msg { font-size: 14px; color: #999; max-width: 280px; line-height: 1.6; }
    .brand { position: fixed; bottom: 20px; font-size: 11px; color: #444; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="spinner" id="loader"></div>
  <div id="msg">جاري التوجيه...</div>
  <div class="brand">DYNAMIC QR BY ORCA-8N</div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyy9jb_sMCxkAqaVHrCdvudXzoLjR3oD5TrzK7ftHNZz-boFvvtVgTcWmbuAbhuDofN6g/exec";
    const id = new URLSearchParams(location.search).get("id");
    const stop = (text) => {
      document.getElementById("loader").style.display = "none";
      document.getElementById("msg").innerText = text;
    };

    if (!id) {
      stop("رابط غير صالح.");
    } else {
      fetch(`${SCRIPT_URL}?action=redirect&id=${encodeURIComponent(id)}`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success" && res.url) location.replace(res.url);
          else if (res.status === "paused") stop("هذا الرمز متوقف مؤقتاً من قِبل المالك.");
          else if (res.status === "empty") stop("لم يتم تفعيل أي رابط على هذا الرمز حتى الآن.");
          else stop("هذا الرمز غير مسجل.");
        })
        .catch(() => stop("تعذر الاتصال، يرجى المحاولة مجدداً."));
    }
  </script>
</body>
</html>
